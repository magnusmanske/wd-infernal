[package]
name = "wd-infernal"
version = "0.1.0"
edition = "2024"
repository = "https://github.com/magnusmanske/wd-infernal"

[dependencies]
# Returns freed memory to the OS; see the global allocator in src/main.rs.
tikv-jemallocator = { version = "0.6", features = ["background_threads"] }
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = [
	"http1",
	"http2",
	"tokio",
	"json",
	"macros",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = { version = "0.37", features = ["serialize"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-http = { version = "0.6", features = ["full"] }
moka = { version = "0.12", features = ["sync"] }
html-escape = "0.2"
wikibase = "0.7"
mediawiki = "0.3"
futures = "0.3"
url = "2"
regex = "1"
reqwest = "0.12"
chrono = "0.4"
urlencoding = "2"
anyhow = "1"
goodreads-metadata-scraper = "0.2"
isbn = "0.8"
wikibase_rest_api = "0.1"
wikimisc = { git = "https://github.com/magnusmanske/wikimisc", features = [
	"database",
	"site-matrix",
	"sparql-client",
	"telemetry"]
}
tools_interface = "0.1"
utoipa = { version = "6", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "10", features = ["axum"] }

# No `panic = 'abort'`: a panicking request must fail only itself, as a 500
# (see `CatchPanicLayer` in src/server.rs), not take the whole server down.
[profile.release]
opt-level = 3
lto = 'fat'
codegen-units = 1

[profile.release-pgo]
inherits = "release"
# Build with: RUSTFLAGS="-C profile-generate=/tmp/pgo-data" cargo build --profile release-pgo
# Run workload, then:
# RUSTFLAGS="-C profile-use=/tmp/pgo-data/merged.profdata -C llvm-args=-pgo-warn-missing-function" cargo build --profile release-pgo
