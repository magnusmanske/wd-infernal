[package]
name = "wd-infernal"
version = "0.1.0"
edition = "2024"

[dependencies]
mimalloc = { version = "0.1", features = ["secure"] }
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = [
	"http1",
	"http2",
	"tokio",
	"json",
	"macros",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = { version = "0.37", features = ["serialize"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-http = { version = "0.6", features = ["full"] }
moka = { version = "0.12", features = ["sync"] }
html-escape = "0.2"
wikibase = "0.7"
mediawiki = "0.3"
futures = "0.3"
url = "2"
async-lazy = "0.1"
regex = "1"
reqwest = "0.12"
chrono = "0.4"
urlencoding = "2"
anyhow = "1"
goodreads-metadata-scraper = "0.2"
isbn = "0.8"
wikibase_rest_api = "0.1"
wikimisc = { version = "*", features = ["database","site-matrix"] }
tools_interface = "0.1"
utoipa = { version = "5", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "8", features = ["axum"] }

[profile.release]
opt-level = 3
lto = 'fat'
panic = 'abort'
codegen-units = 1

[profile.release-pgo]
inherits = "release"
# Build with: RUSTFLAGS="-C profile-generate=/tmp/pgo-data" cargo build --profile release-pgo
# Run workload, then:
# RUSTFLAGS="-C profile-use=/tmp/pgo-data/merged.profdata -C llvm-args=-pgo-warn-missing-function" cargo build --profile release-pgo
